<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rowbook — read spreadsheets like a book</title>
<script>document.documentElement.dataset.mode = localStorage.getItem("rowbook-mode") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")</script>
<link rel="stylesheet" href="vendor/phosphor/style.css">
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --ink: #1d1d1f; --soft: #3a3a3f; --muted: #6e6e73; --line: #e3e3e8;
    --accent: #2f5bea; --accent-ink: #fff; --chip: #ebebf0; --hover: #f0f0f4;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --scrim: rgba(20,20,30,.28);
  }
  [data-mode="dark"] {
    --bg: #111113; --panel: #1c1c1f; --ink: #f2f2f4; --soft: #d6d6dc; --muted: #9a9aa2; --line: #2e2e33;
    --accent: #5b8cff; --chip: #2a2a2f; --hover: #26262b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --scrim: rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Arial, sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .ph { font-size: 17px; vertical-align: -3px; }
  button, select, input { font: inherit; color: inherit; }
  .btn, select {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover, select:hover { background: var(--hover); }
  .btn.icon { width: 34px; padding: 0; justify-content: center; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--hover); }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .field select { max-width: 260px; color: var(--ink); font-size: 14px; }
  .search { position: relative; flex: 1 1 240px; }
  .search .ph { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 34px; padding: 0 12px 0 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  }
  input:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; margin-right: auto; }
  .brand img { width: 30px; height: 30px; }
  .brand .file { font-weight: 500; font-size: 13px; letter-spacing: 0; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px 4px; flex-wrap: wrap; }
  details.fields { position: relative; }
  details.fields summary { list-style: none; }
  details.fields summary::-webkit-details-marker { display: none; }
  details.fields .menu {
    position: absolute; z-index: 5; top: 115%; right: 0; width: 340px; max-height: 60vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: var(--shadow);
  }
  details.fields .menu p { margin: 4px 6px 8px; color: var(--muted); font-size: 12px; }
  details.fields .menu label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 6px; font-size: 13px; border-radius: 6px; cursor: pointer; }
  details.fields .menu label:hover { background: var(--hover); }

  .chips { display: flex; gap: 6px; padding: 10px 18px 0; overflow-x: auto; scrollbar-width: none; }
  .chip { white-space: nowrap; border: none; background: var(--chip); border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer; }
  .chip b { font-weight: 600; margin-left: 5px; color: var(--muted); }
  .chip.on { background: var(--ink); color: var(--bg); }
  .chip.on b { color: inherit; opacity: .7; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .strip {
    flex: 1; min-height: 0; display: flex; align-items: flex-start; gap: 16px; padding: 14px 18px 18px; overflow-x: auto;
    scroll-snap-type: x mandatory; scroll-padding: 0 18px;
  }
  .card {
    position: relative; flex: 0 0 min(420px, calc(100vw - 36px)); max-height: 100%; scroll-snap-align: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    overflow: hidden; padding: 24px 26px 22px; cursor: pointer; transition: transform .12s, border-color .12s;
    display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { font-size: 21px; line-height: 1.2; letter-spacing: -.02em; margin: 0 40px 6px 0; }
  .card .open { position: absolute; top: 18px; right: 18px; }
  .card .body { overflow: hidden; flex: 1; }
  .card .body.clipped { -webkit-mask-image: linear-gradient(#000 85%, transparent); mask-image: linear-gradient(#000 85%, transparent); }
  .card .q { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; }
  .card .a { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .hint { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 12px; display: flex; gap: 6px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--soft); background: var(--chip); border-radius: 999px; padding: 3px 10px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12.5px; }
  mark { background: #ffe58a; color: #1d1d1f; border-radius: 3px; }
  a { color: var(--accent); }

  .status { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }

  .empty { flex: 1; display: grid; place-items: center; padding: 30px; }
  .drop {
    width: min(620px, 100%); border: 2px dashed var(--line); border-radius: 22px; padding: 42px 34px 30px; text-align: center; background: var(--panel);
  }
  .drop.over { border-color: var(--accent); }
  .drop img { width: 96px; height: 96px; }
  .drop h1 { margin: 8px 0 8px; font-size: 28px; letter-spacing: -.03em; }
  .drop p { color: var(--muted); margin: 6px auto; max-width: 460px; }
  .drop .row { display: flex; gap: 8px; margin-top: 20px; }
  .drop .row .search { flex: 1; }
  .privacy { font-size: 13px; margin-top: 18px !important; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .error { color: #d93025; font-size: 13px; min-height: 1.2em; }

  /* ── Reader: Notion-style side peek, or full page ── */
  .reader { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end; }
  .reader .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .15s; }
  .reader .sheet {
    position: relative; width: min(720px, 100vw); height: 100%; background: var(--panel); box-shadow: -12px 0 40px rgba(0,0,0,.18);
    display: flex; flex-direction: column; animation: slide .18s ease-out;
  }
  .reader.full .sheet { width: 100vw; animation: fade .15s; }
  .reader .bar { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .reader .pos { margin: 0 8px; }
  .reader .page { flex: 1; overflow-y: auto; }
  .reader article { max-width: 680px; margin: 0 auto; padding: 40px 44px 80px; }
  .reader h1 { font-size: 34px; line-height: 1.12; letter-spacing: -.03em; margin: 0 0 12px; }
  .reader .meta { margin-bottom: 30px; }
  .reader .q { font-size: 13.5px; font-weight: 600; color: var(--muted); margin: 26px 0 4px; }
  .reader .a { font-size: 17px; line-height: 1.7; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .reader .keys { color: var(--muted); font-size: 12px; text-align: center; padding: 0 0 18px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="icon.svg" alt="">Rowbook <span class="file" id="fileName" hidden></span></div>
  <label class="field" title="How downloaded PDFs look">PDF style
    <select id="theme">
      <option value="apple">Apple</option>
      <option value="notion">Notion</option>
      <option value="github">GitHub</option>
      <option value="minimal">Minimal</option>
      <option value="amoako-1">Amoako</option>
    </select>
  </label>
  <button class="btn" id="openBtn"><i class="ph ph-folder-open"></i> Open file</button>
  <button class="btn icon" id="modeBtn" title="Light / dark"><i class="ph ph-moon"></i></button>
  <input type="file" id="file" accept=".csv,.tsv,.xlsx,.xls,.xlsm,.ods" hidden>
</header>

<main>
  <section class="empty" id="empty">
    <div class="drop" id="drop">
      <img src="icon.svg" alt="">
      <h1>Read a spreadsheet like a book</h1>
      <p>Drop a CSV or Excel file here. Each row becomes its own page, sorted into groups by whichever column you choose.</p>
      <p style="margin-top:18px"><button class="btn primary" id="openBtn2"><i class="ph ph-folder-open"></i> Choose a file</button></p>
      <div class="row">
        <div class="search"><i class="ph ph-link"></i><input type="url" id="sheetUrl" placeholder="…or paste a Google Sheets link"></div>
        <button class="btn" id="sheetBtn">Load</button>
      </div>
      <p class="error" id="error"></p>
      <p class="privacy"><i class="ph ph-lock-simple"></i> Your file stays in this browser tab. Nothing is uploaded or saved.</p>
    </div>
  </section>

  <section id="viewer" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="toolbar">
      <div class="search"><i class="ph ph-magnifying-glass"></i><input type="search" id="search" placeholder="Find a name, ID or answer   ( / )"></div>
      <label class="field"><i class="ph ph-squares-four"></i> Group by <select id="groupBy"></select></label>
      <label class="field"><i class="ph ph-identification-card"></i> Name <select id="titleCol"></select></label>
      <details class="fields">
        <summary class="btn"><i class="ph ph-eye-slash"></i> Hide fields</summary>
        <div class="menu"><p>Unticked fields are hidden on screen and in PDFs.</p><div id="fieldMenu"></div></div>
      </details>
    </div>
    <div class="chips" id="chips"></div>
    <div class="strip" id="strip"></div>
    <div class="status">
      <span id="count"></span>
      <button class="btn icon ghost" id="prev" title="Previous (←)"><i class="ph ph-caret-left"></i></button>
      <button class="btn icon ghost" id="next" title="Next (→)"><i class="ph ph-caret-right"></i></button>
      <span class="spacer"></span>
      <button class="btn" id="mdBtn" title="A plain-text copy (works with mdpdf)"><i class="ph ph-file-text"></i> Text file</button>
      <button class="btn primary" id="groupPdf"><i class="ph ph-file-pdf"></i> <span id="groupPdfLabel">Save all as PDF</span></button>
    </div>
  </section>
</main>

<div class="reader" id="reader" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet">
    <div class="bar">
      <button class="btn icon ghost" id="rClose" title="Close (Esc)"><i class="ph ph-x"></i></button>
      <button class="btn icon ghost" id="rMode" title="Full page / side panel (F)"><i class="ph ph-arrows-out-simple"></i></button>
      <button class="btn icon ghost" id="rPrev" title="Previous (←)"><i class="ph ph-caret-left"></i></button>
      <button class="btn icon ghost" id="rNext" title="Next (→)"><i class="ph ph-caret-right"></i></button>
      <span class="pos" id="rPos"></span>
      <span class="spacer"></span>
      <button class="btn" id="rPdf"><i class="ph ph-file-pdf"></i> Save as PDF</button>
    </div>
    <div class="page" id="rPage"></div>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const state = { name: "", columns: [], rows: [], hidden: new Set(), groupBy: "", titleCol: "", group: null, query: "", view: [], open: -1 };

// ── Loading ──────────────────────────────────────────────────────────────────

function loadWorkbook(data, name) {
  const text = /\.(csv|tsv|txt)$/i.test(name) || name === "Google Sheet";
  const wb = text ? XLSX.read(new TextDecoder().decode(data), { type: "string", dense: true })
                  : XLSX.read(data, { type: "array", cellDates: true, dense: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" })
    .filter(r => r.some(c => String(c).trim()));
  if (grid.length < 2) throw new Error("That sheet looks empty.");
  const header = grid[0].map((h, i) => String(h).trim() || `Column ${i + 1}`);
  const rows = grid.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, String(r[i] ?? "").trim()])));
  // drop columns nobody filled in
  state.columns = header.filter(h => rows.some(r => r[h]));
  state.rows = rows;
  state.name = name.replace(/\.[^.]+$/, "");
  state.hidden = new Set(state.columns.filter(c => /^(timestamp|email address|score)$/i.test(c)));
  state.groupBy = guessGroup();
  state.titleCol = state.columns.find(c => /full name|^name$|name/i.test(c)) || state.columns[0];
  state.group = null;
  state.query = "";
  $("search").value = "";
  $("empty").hidden = true;
  $("viewer").hidden = false;
  $("fileName").hidden = false;
  $("fileName").innerHTML = `<i class="ph ph-file-csv"></i>${esc(name)} · ${rows.length} rows`;
  setupControls();
  render();
}

function distinct(col) { return new Set(state.rows.map(r => r[col]).filter(Boolean)); }

function guessGroup() {
  const candidates = state.columns.filter(c => { const n = distinct(c).size; return n > 1 && n <= 30; });
  return candidates.find(c => /committee|category|department|role|track|position|interested|choice/i.test(c))
    || candidates[0] || "";
}

async function readFile(file) {
  showError("");
  try { loadWorkbook(new Uint8Array(await file.arrayBuffer()), file.name); }
  catch (e) { showError("Couldn't read that file: " + e.message); }
}

async function loadSheet(url) {
  showError("");
  const m = url.match(/\/spreadsheets\/d\/([\w-]+)/);
  const gid = url.match(/[#&?]gid=(\d+)/);
  const csvUrl = m ? `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv${gid ? "&gid=" + gid[1] : ""}` : url;
  try {
    const res = await fetch(csvUrl);
    if (!res.ok) throw new Error("the sheet isn't shared as “anyone with the link”");
    loadWorkbook(new Uint8Array(await res.arrayBuffer()), "Google Sheet");
  } catch (e) {
    showError("Couldn't load that link (" + e.message + "). In Sheets, use File → Download → CSV and drop the file here instead.");
  }
}

function showError(msg) { $("error").textContent = msg; }

// ── Controls ─────────────────────────────────────────────────────────────────

function options(sel, values, current, blank) {
  sel.innerHTML = (blank ? `<option value="">${blank}</option>` : "") +
    values.map(v => `<option${v === current ? " selected" : ""}>${esc(v)}</option>`).join("");
}

function setupControls() {
  options($("groupBy"), state.columns.filter(c => distinct(c).size > 1 && distinct(c).size <= 60), state.groupBy, "Nothing");
  options($("titleCol"), state.columns, state.titleCol);
  $("fieldMenu").innerHTML = state.columns.map(c =>
    `<label><input type="checkbox" data-col="${esc(c)}"${state.hidden.has(c) ? "" : " checked"}> ${esc(c)}</label>`).join("");
}

function filtered() {
  const q = state.query.toLowerCase();
  return state.rows.filter(r =>
    (state.group === null || (r[state.groupBy] || "(blank)") === state.group) &&
    (!q || Object.values(r).some(v => v.toLowerCase().includes(q))));
}

function render() {
  const chips = $("chips");
  if (state.groupBy) {
    const counts = {};
    state.rows.forEach(r => { const k = r[state.groupBy] || "(blank)"; counts[k] = (counts[k] || 0) + 1; });
    const keys = Object.keys(counts).sort();
    chips.innerHTML = `<button class="chip${state.group === null ? " on" : ""}" data-all>All<b>${state.rows.length}</b></button>` +
      keys.map(k => `<button class="chip${state.group === k ? " on" : ""}" data-g="${esc(k)}">${esc(k)}<b>${counts[k]}</b></button>`).join("");
  } else chips.innerHTML = "";

  state.view = filtered();
  const fields = visibleFields();
  $("strip").innerHTML = state.view.length ? state.view.map((r, i) => `
    <article class="card" data-i="${i}" tabindex="0">
      <h2>${hl(r[state.titleCol] || "Untitled")}</h2>
      <button class="btn icon ghost open" title="Open"><i class="ph ph-arrows-out-simple"></i></button>
      <div class="meta">${state.groupBy && r[state.groupBy] ? `<span class="tag">${esc(r[state.groupBy])}</span>` : ""}<span>${i + 1} of ${state.view.length}</span></div>
      <div class="body">${fields.filter(c => r[c]).map(c => `<p class="q">${esc(c)}</p><p class="a">${hl(r[c])}</p>`).join("")}</div>
      <div class="hint"><i class="ph ph-book-open-text"></i> Read</div>
    </article>`).join("") : `<p style="color:var(--muted);padding:20px">Nothing matches.</p>`;
  $("strip").scrollLeft = 0;
  document.querySelectorAll(".card .body").forEach(b => b.classList.toggle("clipped", b.scrollHeight > b.clientHeight + 2));
  $("groupPdfLabel").textContent = state.group !== null ? `Save “${state.group}” as PDF` : state.query ? "Save results as PDF" : "Save all as PDF";
  updateCount();
}

function visibleFields() { return state.columns.filter(c => !state.hidden.has(c) && c !== state.titleCol); }

function current() {
  const strip = $("strip");
  let idx = 0;
  [...strip.children].forEach((c, i) => { if (c.offsetLeft - strip.offsetLeft <= strip.scrollLeft + 20) idx = i; });
  return idx;
}

function go(i) {
  const card = $("strip").children[i];
  if (card && card.classList.contains("card")) card.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
}

function updateCount() {
  const n = state.view.length;
  $("count").textContent = n ? `${current() + 1} of ${n}${state.group !== null ? " in " + state.group : ""}` : "0 rows";
}

// ── Reader ───────────────────────────────────────────────────────────────────

function openReader(i, push = true) {
  if (!state.view[i]) return;
  const first = state.open < 0;
  state.open = i;
  const r = state.view[i];
  $("rPage").innerHTML = `<article>
      <h1>${hl(r[state.titleCol] || "Untitled")}</h1>
      <div class="meta">${state.groupBy && r[state.groupBy] ? `<span class="tag"><i class="ph ph-squares-four"></i>${esc(r[state.groupBy])}</span>` : ""}</div>
      ${visibleFields().filter(c => r[c]).map(c => `<p class="q">${esc(c)}</p><p class="a">${linkify(hl(r[c]))}</p>`).join("")}
    </article>
    <p class="keys"><kbd>←</kbd> <kbd>→</kbd> previous / next · <kbd>F</kbd> full page · <kbd>Esc</kbd> close</p>`;
  $("rPage").scrollTop = 0;
  $("rPos").textContent = `${i + 1} of ${state.view.length}`;
  $("rPrev").disabled = i === 0;
  $("rNext").disabled = i === state.view.length - 1;
  $("reader").hidden = false;
  // the browser Back button closes the reader
  if (first && push) history.pushState({ reader: true }, "");
}

function closeReader(fromHistory) {
  if (state.open < 0) return;
  const i = state.open;
  state.open = -1;
  $("reader").hidden = true;
  go(i);
  if (!fromHistory && history.state?.reader) history.back();
}

function setReaderMode(full) {
  $("reader").classList.toggle("full", full);
  $("rMode").innerHTML = `<i class="ph ${full ? "ph-sidebar-simple" : "ph-arrows-out-simple"}"></i>`;
  $("rMode").title = full ? "Side panel (F)" : "Full page (F)";
  localStorage.setItem("rowbook-reader", full ? "full" : "side");
}

// ── Markdown + PDF (same look as mdpdf: the themes are mdpdf's own CSS) ──────

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function hl(s) {
  const out = esc(s);
  if (!state.query) return out;
  const q = esc(state.query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return out.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`);
}
function linkify(html) { return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }

function stats(rows) {
  // a breakdown for the group column plus any short-answer columns (year, major, nationality…)
  const cols = [state.groupBy, ...state.columns.filter(c => c !== state.groupBy && !state.hidden.has(c)
    && /year|major|level|nationality|gender|class/i.test(c))].filter(Boolean);
  return cols.map(c => {
    const counts = {};
    rows.forEach(r => { const k = r[c] || "(blank)"; counts[k] = (counts[k] || 0) + 1; });
    return { col: c, counts: Object.entries(counts).sort((a, b) => b[1] - a[1]) };
  }).filter(s => s.counts.length > 1 || s.col === state.groupBy);
}

function title(rows) {
  const scope = state.group !== null ? state.group : state.name;
  return rows.length === 1 ? rows[0][state.titleCol] || "Untitled" : `${scope} — ${rows.length} responses`;
}

function toMarkdown(rows) {
  const md = s => String(s).replace(/([\\`*_<>#])/g, "\\$1");
  const fields = visibleFields();
  let out = "";
  if (rows.length > 1) {
    out += `# ${md(title(rows))}\n\n`;
    stats(rows).forEach(s => {
      out += `### ${md(s.col)}\n\n` + s.counts.map(([k, n]) => `- ${md(k)}: **${n}**`).join("\n") + "\n\n";
    });
  }
  rows.forEach(r => {
    if (rows.length > 1) out += `<div style="page-break-before: always"></div>\n\n`;
    out += `## ${md(r[state.titleCol] || "Untitled")}\n\n`;
    fields.filter(c => r[c]).forEach(c => {
      out += `**${md(c)}**\n\n${md(r[c]).replace(/\n/g, "  \n")}\n\n`;
    });
  });
  return out;
}

function toHtml(rows) {
  const fields = visibleFields();
  let out = "";
  if (rows.length > 1) {
    out += `<h1>${esc(title(rows))}</h1>`;
    stats(rows).forEach(s => {
      out += `<h3>${esc(s.col)}</h3><ul>` + s.counts.map(([k, n]) => `<li>${esc(k)}: <strong>${n}</strong></li>`).join("") + "</ul>";
    });
  }
  rows.forEach(r => {
    out += `<section class="rb-page"><h2>${esc(r[state.titleCol] || "Untitled")}</h2>`;
    fields.filter(c => r[c]).forEach(c => {
      out += `<p><strong>${esc(c)}</strong></p><p class="rb-a">${linkify(esc(r[c]))}</p>`;
    });
    out += "</section>";
  });
  return out;
}

function printPdf(rows) {
  const frame = document.createElement("iframe");
  frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title(rows))}</title>
    <base href="${esc(location.href)}">
    <link rel="stylesheet" href="themes/${$("theme").value}.css">
    <style>
      @page { size: A4; margin: 12mm; }
      body { max-width: none; padding: 0; }
      .rb-a { white-space: pre-wrap; margin-top: -0.4em; }
      ${rows.length > 1 ? ".rb-page { break-before: page; }" : ""}
      .rb-page > h2:first-child { margin-top: 0; }
      p strong { break-after: avoid; }
    </style></head><body>${toHtml(rows)}</body></html>`;
  frame.onload = () => {
    // give fonts a beat to settle, then open the print dialog (choose "Save as PDF")
    setTimeout(() => { frame.contentWindow.focus(); frame.contentWindow.print(); setTimeout(() => frame.remove(), 1000); }, 300);
  };
  document.body.appendChild(frame);
}

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── Events ───────────────────────────────────────────────────────────────────

$("openBtn").onclick = $("openBtn2").onclick = () => $("file").click();
$("file").onchange = e => { e.target.files[0] && readFile(e.target.files[0]); e.target.value = ""; };
$("sheetBtn").onclick = () => $("sheetUrl").value.trim() && loadSheet($("sheetUrl").value.trim());
$("sheetUrl").onkeydown = e => e.key === "Enter" && $("sheetBtn").click();

["dragover", "dragenter"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
document.addEventListener("drop", e => e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]));

function setMode(mode) {
  document.documentElement.dataset.mode = mode;
  $("modeBtn").innerHTML = `<i class="ph ${mode === "dark" ? "ph-sun" : "ph-moon"}"></i>`;
}
setMode(document.documentElement.dataset.mode);
$("modeBtn").onclick = () => {
  const mode = document.documentElement.dataset.mode === "dark" ? "light" : "dark";
  setMode(mode);
  localStorage.setItem("rowbook-mode", mode);
};
$("theme").value = localStorage.getItem("rowbook-theme") || "apple";
$("theme").onchange = () => localStorage.setItem("rowbook-theme", $("theme").value);
setReaderMode(localStorage.getItem("rowbook-reader") === "full");

$("groupBy").onchange = e => { state.groupBy = e.target.value; state.group = null; render(); };
$("titleCol").onchange = e => { state.titleCol = e.target.value; render(); };
$("search").oninput = e => { state.query = e.target.value.trim(); render(); };
$("chips").onclick = e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  state.group = "all" in chip.dataset ? null : chip.dataset.g;
  render();
};
$("fieldMenu").onchange = e => {
  const col = e.target.dataset.col;
  e.target.checked ? state.hidden.delete(col) : state.hidden.add(col);
  const i = current(); render(); $("strip").children[i]?.scrollIntoView({ inline: "start", block: "nearest" });
};
document.addEventListener("click", e => { if (!e.target.closest("details.fields")) $("viewer").querySelector("details.fields").open = false; });
$("strip").onscroll = () => requestAnimationFrame(updateCount);
$("strip").onclick = e => { const c = e.target.closest(".card"); if (c && !e.target.closest("a")) openReader(+c.dataset.i); };
$("prev").onclick = () => go(Math.max(0, current() - 1));
$("next").onclick = () => go(Math.min(state.view.length - 1, current() + 1));
$("groupPdf").onclick = () => state.view.length && printPdf(state.view);
$("mdBtn").onclick = () => state.view.length && download(`${title(state.view).replace(/[\\/:*?"<>|]/g, "")}.md`, toMarkdown(state.view));

$("scrim").onclick = $("rClose").onclick = () => closeReader();
$("rMode").onclick = () => setReaderMode(!$("reader").classList.contains("full"));
$("rPrev").onclick = () => openReader(state.open - 1);
$("rNext").onclick = () => openReader(state.open + 1);
$("rPdf").onclick = () => printPdf([state.view[state.open]]);
window.addEventListener("popstate", () => closeReader(true));

document.addEventListener("keydown", e => {
  if ($("viewer").hidden || /INPUT|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  const reading = state.open >= 0;
  if (e.key === "ArrowRight") { e.preventDefault(); reading ? $("rNext").click() : $("next").click(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); reading ? $("rPrev").click() : $("prev").click(); }
  else if (e.key === "Escape" && reading) closeReader();
  else if ((e.key === "f" || e.key === "F") && reading) $("rMode").click();
  else if (e.key === "Enter" && !reading && e.target.classList.contains("card")) openReader(+e.target.dataset.i);
  else if (e.key === "/" && !reading) { e.preventDefault(); $("search").focus(); }
});
</script>

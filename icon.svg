<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#2440C8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#F0443A"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1A5C" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- back page peeking out (the "next row") -->
  <rect x="318" y="262" width="430" height="520" rx="44" fill="#fff" opacity=".35" transform="rotate(7 533 522)"/>
  <!-- front page: a spreadsheet row read as a document -->
  <g filter="url(#drop)">
    <rect x="276" y="242" width="430" height="540" rx="44" fill="url(#page)"/>
  </g>
  <rect x="330" y="312" width="210" height="34" rx="17" fill="#1D2A6B"/>
  <rect x="330" y="384" width="120" height="20" rx="10" fill="#9AA6CC"/>
  <rect x="330" y="420" width="320" height="22" rx="11" fill="#C9D1EA"/>
  <rect x="330" y="482" width="150" height="20" rx="10" fill="#9AA6CC"/>
  <rect x="330" y="518" width="290" height="22" rx="11" fill="#C9D1EA"/>
  <rect x="330" y="580" width="110" height="20" rx="10" fill="#9AA6CC"/>
  <rect x="330" y="616" width="320" height="22" rx="11" fill="#C9D1EA"/>
  <rect x="330" y="656" width="230" height="22" rx="11" fill="#C9D1EA"/>
  <!-- bookmark -->
  <path d="M600 242 h64 v150 l-32 -26 l-32 26 z" fill="url(#ribbon)"/>
</svg>
